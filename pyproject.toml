[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "soundmaster"
version = "0.8.1"
description = "A local-first Windows soundboard for gamers."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "MIT" }
authors = [{ name = "SoundMaster" }]
dependencies = [
    "PyQt6>=6.7,<7",
    "huggingface_hub>=0.30,<1",
    "keyboard>=0.13,<1",
    "sounddevice>=0.5,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]
build = [
    "pyinstaller>=6.10,<7",
]
audio = [
    "sounddevice>=0.5,<1",
]
tts = [
    "qwen-tts",
    "omnivoice",
    "soundfile>=0.12,<1",
    "torch>=2.6,<3",
]
# Pocket TTS is deliberately its own extra: it is a 100M-parameter CPU model and
# needs neither CUDA wheels nor the local Whisper pass the other engines use.
pocket = [
    "pocket-tts",
    "soundfile>=0.12,<1",
]
voice-auto = [
    "faster-whisper>=1.1,<2",
]

[project.scripts]
soundmaster = "soundmaster.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
