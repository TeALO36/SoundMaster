[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "soundmaster"
version = "0.9.4"
description = "A local-first Windows soundboard for gamers."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "MIT" }
authors = [{ name = "SoundMaster" }]
dependencies = [
    "PyQt6>=6.7,<7",
    "huggingface_hub>=0.30,<1",
    "keyboard>=0.13,<1",
    "numpy>=1.26,<3",
    "sounddevice>=0.5,<1",
    # Decoding WAV/MP3/OGG/FLAC into PCM for the zero-latency playback path;
    # without it every sound falls back to QMediaPlayer and starts ~2 s late.
    "soundfile>=0.12,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]
build = [
    "pyinstaller>=6.10,<7",
]
audio = [
    "sounddevice>=0.5,<1",
]
# Qwen3-TTS engine stack. omnivoice and f5-tts are deliberately NOT here:
# their pins conflict with qwen-tts (transformers==4.57.3 vs >=5.3.0) and make
# the whole extra unresolvable — pip answers "ResolutionImpossible". Each
# engine must therefore keep its own environment. qwen-tts also declares
# gradio/sox for its CLI demo only; the release build installs it with
# `--no-deps` and skips them (the inference import path does not use them).
tts = [
    "qwen-tts",
    "torch>=2.6,<3",
    "torchaudio>=2.6,<3",
    "transformers==4.57.3",
    "accelerate==1.12.0",
    "einops>=0.7,<1",
    "librosa>=0.10,<1",
    "onnxruntime>=1.17,<2",
    "faster-whisper>=1.1,<2",
]
# Pocket TTS is deliberately its own extra: it is a 100M-parameter CPU model and
# needs neither CUDA wheels nor the local Whisper pass the other engines use.
pocket = [
    "pocket-tts",
    "soundfile>=0.12,<1",
    # Decodes the audio track of imported videos (MP4, MOV, …).
    "av>=12,<19",
]
voice-auto = [
    "faster-whisper>=1.1,<2",
]

[project.scripts]
soundmaster = "soundmaster.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
