[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "soundmaster"
version = "0.1.0"
description = "A local-first Windows soundboard for gamers."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "MIT" }
authors = [{ name = "SoundMaster" }]
dependencies = [
    "PyQt6>=6.7,<7",
    "huggingface_hub>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]
build = [
    "pyinstaller>=6.10,<7",
]

[project.scripts]
soundmaster = "soundmaster.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
