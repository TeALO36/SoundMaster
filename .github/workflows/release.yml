name: Windows Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to release, for example v0.6.1"
        required: true
        type: string

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.11"

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve release version
        id: version
        shell: pwsh
        env:
          TAG_FROM_INPUT: ${{ inputs.tag }}
          TAG_FROM_REF: ${{ github.ref_name }}
        run: |
          $tag = if ($env:TAG_FROM_INPUT) { $env:TAG_FROM_INPUT } else { $env:TAG_FROM_REF }
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Release tags must match vMAJOR.MINOR.PATCH. Received '$tag'."
          }
          $version = $tag.Substring(1)
          $projectVersion = (Select-String -Path "pyproject.toml" -Pattern '^version = "([^"]+)"$' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($version -ne $projectVersion) {
            throw "Release tag '$version' must match pyproject.toml version '$projectVersion'. Bump pyproject.toml before tagging."
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          # v0.8.2-v0.8.5 introduced the audio engine before declaring numpy
          # in pyproject.toml; keep manual publication of those tags recoverable.
          python -m pip install ".[dev,build]" "numpy>=1.26,<3"

      - name: Run tests before packaging
        shell: pwsh
        run: python -m pytest -q

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build portable ZIP and installer
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: .\packaging\build_windows.ps1 -Version $env:APP_VERSION

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SoundMaster-Windows-${{ steps.version.outputs.version }}
          path: |
            dist/SoundMaster-v*-Portable.zip
            dist/installer/SoundMaster-v*-Setup.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: SoundMaster ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/SoundMaster-v*-Portable.zip
            dist/installer/SoundMaster-v*-Setup.exe
